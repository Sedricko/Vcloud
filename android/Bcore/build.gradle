apply plugin: 'com.android.library'

android {
    namespace 'com.vcloud.motor'

    compileSdk rootProject.ext.compileSdkVersion


    aidlPackagedList "android/app/IServiceConnection.aidl"
    aidlPackagedList "android/accounts/IAccountManagerResponse.aidl"
    buildFeatures {
        aidl true
    }
    buildFeatures {
        prefab true
    }
    defaultConfig {
        minSdkVersion rootProject.ext.minSdk

        consumerProguardFiles "consumer-rules.pro"
        ndk {
            
            abiFilters 'arm64-v8a' , 'armeabi-v7a'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        ndkBuild {
            path 'src/main/cpp/Android.mk'
        }
        ndkVersion rootProject.ext.ndkVersion
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    
    
    tasks.withType(JavaCompile) {
        options.compilerArgs << "-Xlint:-deprecation" << "-Xlint:-unchecked" << "-Xlint:-rawtypes"
        options.fork = true
        options.forkOptions.jvmArgs << "-Xmx2048m"
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
    sourceSets {
        main {
            jniLibs.srcDir(layout.buildDirectory.dir("generated/vsuJniLibs"))
        }
    }
    lintOptions {

        checkReleaseBuilds false
        abortOnError false
        warningsAsErrors false
        disable "UnusedResources", 'RestrictedApi'
        textOutput "stdout"
        textReport false
        checkOnly 'NewApi', 'InlinedApi'
    }
}


// Strip the AIDL-generated "Using: ..." comment line which contains backslash sequences
// that Java's compiler mis-parses as Unicode escapes on Windows paths.
tasks.matching { it.name.startsWith('compileReleaseJavaWithJavac') || it.name.startsWith('compileDebugJavaWithJavac') }.all {
    doFirst {
        def aidlOut = file("$buildDir/generated/aidl_source_output_dir")
        if (aidlOut.exists()) {
            aidlOut.eachFileRecurse { f ->
                if (f.name.endsWith('.java')) {
                    def content = f.text
                    if (content.contains(' * Using:')) {
                        content = content.replaceAll(/(?m)^ \* Using:.*$/, '')
                        f.text = content
                    }
                }
            }
        }
    }
}

tasks.withType(Javadoc) {
    options.addStringOption('Xdoclint:none', '-quiet')
    options.addStringOption('encoding', 'UTF-8')
    options.addStringOption('charSet', 'UTF-8')
}


dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar", "*.aar"])
    implementation libs.material
    implementation(project(":black-reflection"))
    annotationProcessor(project(":compiler"))
    implementation libs.appcompat

    implementation 'com.moandjiezana.toml:toml4j:0.7.2'

    implementation 'com.github.tiann:FreeReflection:3.2.2'



    
}

// Vcloud: copia o executável "vsu" (su do root interno) como libvsu.so para dentro do APK.
// Falha o build se não achar, para não entregar um APK sem root sem ninguém perceber.
tasks.register("copyVsu") {
    def saida = layout.buildDirectory.dir("generated/vsuJniLibs").get().asFile
    def raiz = layout.buildDirectory.get().asFile
    def cxx = file(".cxx")
    doLast {
        ["arm64-v8a", "armeabi-v7a"].each { abi ->
            def achados = [raiz, cxx].findAll { it.exists() }.collectMany { base ->
                fileTree(dir: base, include: "**/${abi}/vsu").files.findAll { it.isFile() && it.length() > 0 }
            }
            if (achados.isEmpty()) {
                throw new GradleException("copyVsu: o executável vsu (${abi}) não foi gerado pelo ndk-build")
            }
            def destino = new File(saida, "${abi}/libvsu.so")
            destino.parentFile.mkdirs()
            java.nio.file.Files.copy(achados.first().toPath(), destino.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            logger.lifecycle("copyVsu: ${achados.first()} -> ${destino}")
        }
    }
}

afterEvaluate {
    tasks.named("copyVsu") {
        dependsOn { tasks.matching { it.name.startsWith("buildNdkBuild") }.toList() }
    }
    tasks.matching { it.name.startsWith("merge") && it.name.endsWith("JniLibFolders") }.configureEach {
        dependsOn "copyVsu"
    }
}
